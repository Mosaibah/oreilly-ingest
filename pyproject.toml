[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oreilly-ingest"
version = "1.0.0"
description = "Export O'Reilly books to Markdown, PDF, EPUB, JSON, or plain text"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14",
    "certifi>=2025.11",
    "charset-normalizer>=3.4",
    "idna>=3.11",
    "lxml>=6.0",
    "markdownify>=1.2",
    "curl-cffi>=0.7.0",
    "six>=1.17",
    "soupsieve>=2.8",
    "tiktoken>=0.5.0",
    "tqdm>=4.67",
    "typing_extensions>=4.15",
    "urllib3>=2.6",
    "weasyprint>=60.0",
]

[project.scripts]
oreilly-ingest = "main:main"

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "plugins*", "utils*", "web*"]
